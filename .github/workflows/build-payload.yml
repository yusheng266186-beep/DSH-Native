name: 构建运行包

# 为什么需要这个工作流
# ------------------
# 运行包此前只能在**某个人手边的机器**上构建，而 `npm ci` 只安装与构建机
# 平台匹配的 optionalDependencies —— 在 arm64 机器（如手机）上构建出的分片
# 缺少 x64 原生绑定，CI 的真实消费验证（跑在 x86_64 上）会直接失败。
#
# 这个工作流把构建固定在 GitHub 的 x86_64 runner 上：产物可复现，
# 不再依赖任何人的本地环境，也就不会再踩同一个坑。
#
# 只上传产物，**不发布、不写任何清单**。发布仍由 scripts/release_payload.py
# 单独执行（先验后发），App 的 latest 清单仍只由 release.yml 维护。

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: '基底 payload 标签（提供已验证的 Android 二进制与上一份清单）'
        required: true
        default: 'payload-v10'
      out_name:
        description: '输出目录名（仅用于产物组织）'
        required: false
        default: 'payload-build'
      publish:
        description: '是否发布。默认 false —— 只构建并上传产物，不动任何 Release'
        type: boolean
        required: false
        default: false
      new_tag:
        description: '发布用的标签（仅当 publish=true）。例：payload-v11'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    outputs:
      dir: ${{ steps.built.outputs.dir }}
      manifest_sha: ${{ steps.built.outputs.manifest_sha }}
      shard_size: ${{ steps.built.outputs.shard_size }}
    # 必须显式写死 x64：默认 runner 类型将来可能变化，而平台错了产物就是废的。
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 确认 runner 架构
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "x86_64" ] || { echo "[FAIL] 必须在 x86_64 上构建运行包"; exit 1; }

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'

      - name: 安装 zstd
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          zstd --version

      - name: 下载基底 payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base-release" "$RUNNER_TEMP/base-runtime"
          gh release download "${{ inputs.base_tag }}" \
            --repo yusheng266186-beep/DSH-Native \
            --pattern dsh.tar.zst --pattern manifest.json --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/base-release"
          (cd "$RUNNER_TEMP/base-release" && \
            awk '$2 ~ /(^|\/)dsh\.tar\.zst$/ {print $1 "  dsh.tar.zst"}' SHA256SUMS.txt > dsh.sha256 && \
            sha256sum -c dsh.sha256)
          # base 是「上一份已验证运行包解出来的运行时」：Android 原生二进制、
          # Pillow 垫片等都从这里继承，而不是重新下载或重新编译。
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/base-release/dsh.tar.zst" \
            -C "$RUNNER_TEMP/base-runtime"
          test -f "$RUNNER_TEMP/base-runtime/node_modules/@mmmbuto/node-pty-android-arm64/prebuilds/android-arm64/pty.node" \
            || { echo "[FAIL] 基底运行包缺少 Android PTY"; exit 1; }

      - name: 构建运行包分片
        env:
          DSH_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_core_payload.py \
            --base "$RUNNER_TEMP/base-runtime" \
            --previous-manifest "$RUNNER_TEMP/base-release/manifest.json" \
            --out "$RUNNER_TEMP/${{ inputs.out_name }}"

      - name: 核对产物
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/${{ inputs.out_name }}"
          cat "$OUT/BUILD-INFO.txt"
          tar --zstd --no-same-owner -tf "$OUT/dsh.tar.zst" > "$RUNNER_TEMP/shard.list"
          echo "--- 分片内全部原生二进制 ---"
          grep -E '\.node$' "$RUNNER_TEMP/shard.list" | sort
          echo "--- 分片内全部带平台后缀的包目录 ---"
          grep -oE 'node_modules/(@deepseek-ai/)?[a-zA-Z@_-]+-(linux|darwin|win32|android)-[a-z0-9-]+' \
            "$RUNNER_TEMP/shard.list" | sort -u
          echo "--- node-addon-system 系列 ---"
          grep 'node-addon-system' "$RUNNER_TEMP/shard.list" | sort || true
          echo "--- 必需项检查 ---"
          grep -q 'node_modules/node-pty/prebuilds/android-arm64/pty.node' "$RUNNER_TEMP/shard.list" \
            || { echo "[FAIL] 分片缺少 Android PTY"; exit 1; }
          grep -q 'node_modules/@deepseek-ai/node-addon-system-linux-x64/package.json' "$RUNNER_TEMP/shard.list" \
            || { echo "[FAIL] 分片缺少 linux-x64 绑定，无法通过真实消费验证"; exit 1; }
          echo "[OK] 分片内容符合要求"

      - name: 上传产物（不发布）
        # 即使核对失败也上传：否则恰好在最需要排查的时候没有产物可看。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payload-${{ inputs.base_tag }}-build
          path: |
            ${{ runner.temp }}/${{ inputs.out_name }}/dsh.tar.zst
            ${{ runner.temp }}/${{ inputs.out_name }}/manifest.json
            ${{ runner.temp }}/${{ inputs.out_name }}/SHA256SUMS.txt
            ${{ runner.temp }}/${{ inputs.out_name }}/BUILD-INFO.txt
            ${{ runner.temp }}/shard.list
          retention-days: 14

      - name: 记录构建产物
        id: built
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/${{ inputs.out_name }}"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum "$OUT/manifest.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "shard_size=$(stat -c%s "$OUT/dsh.tar.zst")" >> "$GITHUB_OUTPUT"

  publish:
    # 默认不跑。只有显式 publish=true 且给了 new_tag 才会执行。
    needs: build
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 校验发布参数
        run: |
          set -euo pipefail
          tag='${{ inputs.new_tag }}'
          [ -n "$tag" ] || { echo "[FAIL] publish=true 时必须给 new_tag"; exit 1; }
          case "$tag" in
            payload-v[0-9]*) ;;
            *) echo "[FAIL] 标签格式应为 payload-v<N>，收到: $tag"; exit 1 ;;
          esac
          base='${{ inputs.base_tag }}'
          [ "$tag" != "$base" ] || { echo "[FAIL] 新标签不能与基底相同: $tag"; exit 1; }

      - name: 取回构建产物
        # build 与 publish 是两个 job、两个 runner，$RUNNER_TEMP 不共享，
        # 必须经 artifact 传递。原先直接引用 needs.build.outputs.dir
        # 会在 publish job 里指向一个不存在的目录。
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: payload-${{ inputs.base_tag }}-build
          path: ${{ runner.temp }}/built

      - name: 下载基底工具片
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/publish"
          mkdir -p "$WORK/base"
          # 工具片从基底 Release 原样取回（字节必须不变，发布前逐个核对 SHA）
          gh release download '${{ inputs.base_tag }}'             --repo yusheng266186-beep/DSH-Native             --pattern 'tools-*.tar.zst' --dir "$WORK/base"
          ls -la "$WORK/base"

      - name: 组装完整 payload 并核对
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/built"
          WORK="$RUNNER_TEMP/publish"
          BASE="$RUNNER_TEMP/base-release"
          cp "$OUT/dsh.tar.zst" "$OUT/manifest.json" "$OUT/BUILD-INFO.txt" "$WORK/"
          cp "$WORK"/base/tools-*.tar.zst "$WORK/"

          echo "--- 工具片必须与基底清单逐字节一致 ---"
          python3 - "$WORK" "$BASE/manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          work, base_manifest = pathlib.Path(sys.argv[1]), json.loads(pathlib.Path(sys.argv[2]).read_text())
          for part in base_manifest['parts']:
              if part['name'] == 'dsh.tar.zst':
                  continue
              path = work / part['name']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != part['sha256']:
                  raise SystemExit(f"[FAIL] {part['name']} 与基底不一致，拒绝发布")
              print(f"  OK {part['name']}")
          PY

          echo "--- 生成覆盖全部资产的 SHA256SUMS ---"
          cd "$WORK"
          sha256sum dsh.tar.zst tools-*.tar.zst manifest.json BUILD-INFO.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布（先 draft，逐个核对摘要，manifest 最后）
        env:
          DSH_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/publish"
          printf '# %s\n\n由 build-payload.yml 在 x86_64 runner 上构建并发布。\n构建产物见 BUILD-INFO.txt。\n' \
            '${{ inputs.new_tag }}' > "$WORK/NOTES.md"
          python3 scripts/release_payload.py \
            --commit "$GITHUB_SHA" --notes "$WORK/NOTES.md" \
            '${{ inputs.new_tag }}' "$WORK"

      - name: 公开后复核
        run: |
          set -euo pipefail
          echo "manifest SHA256（本地产物）: ${{ needs.build.outputs.manifest_sha }}"
          echo "分片大小（本地产物）:     ${{ needs.build.outputs.shard_size }}"
