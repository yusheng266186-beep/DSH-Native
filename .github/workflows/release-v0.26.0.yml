# One-time audited release runner for v0.26.0 test.
# It checks out the exact merged main commit, so this temporary workflow is never pushed to main.
name: 发布 v0.26.0 测试版（一次性）

on:
  push:
    branches:
      - codex/release-v0-26-0
    paths:
      - '.github/workflows/release-v0.26.0.yml'

permissions:
  contents: write

concurrency:
  group: release-v0.26.0-test
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5703163e4d3eda9154277fcb373312e950940fe9
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 升版本并完整构建
        run: |
          set -euo pipefail
          bash scripts/bump_version.sh 0.26.0
          bash scripts/ci_build.sh "$RUNNER_TEMP/dsh-build"

      - name: 验证主分支推送权限
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "演练：版本号 0.26.0 [skip ci]"
          git push --dry-run origin HEAD:main

  release:
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5703163e4d3eda9154277fcb373312e950940fe9
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 核对签名密钥
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          URL="https://github.com/yusheng266186-beep/DSH-Native/releases/download/v0.25.8-bootstrap/DSHNative-bootstrap.apk"
          APKSIGNER_JAR="$BT/lib/apksigner.jar" bash scripts/check_signer.sh "$URL"

      - name: 升版本并完整构建
        run: |
          set -euo pipefail
          bash scripts/bump_version.sh 0.26.0
          bash scripts/ci_build.sh "$RUNNER_TEMP/dsh-build"

      - name: 发布测试版并验证下载
        run: |
          set -euo pipefail
          bash scripts/release.sh 0.26.0 "$RUNNER_TEMP/dsh-build"             release-notes/v0.26.0.md test

      - name: 提交版本号与测试清单
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "发布 0.26.0 test 通道：版本号与清单 [skip ci]"
          git push origin HEAD:main
