# 发版优先复用同源码树已通过完整 CI 的签名 APK，无匹配产物才完整重建。
# 原签名、安装器、资产和两条下载路径校验通过后，才更新清单并提交。
#
# 注意：GitHub 用 GITHUB_TOKEN 推送的提交**不会**再触发其它工作流，
#       所以这次提交里的版本号变更不会引起重复构建（另加了 [skip ci] 兜底）。
name: 发版

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.23.5）'
        required: true
      channel:
        description: '发布通道；test 是预发布且只更新 latest-test.json'
        type: choice
        required: true
        default: test
        options:
          - test
          - stable
      notes_file:
        description: '发布说明文件（可选；默认 release-notes/v<版本>.md，再退回 git log）'
        required: false
        default: ''
      dry_run:
        description: '演练：只升版本号 + 构建 + 检查推送权限，不发布、不提交'
        type: boolean
        required: false
        default: false
      signer_ref:
        description: '签名比对参考 tag（可选；默认取最新发布版）'
        required: false
        default: ''
      build_run_id:
        description: '已通过完整构建的 Actions run ID；精确复用该 APK（留空自动查找，无匹配则完整构建）'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: dsh-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0        # 生成发布说明需要历史与 tag

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 取得同一份源码的完整 CI 安装包
        id: verified
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ARGS=()
          if [ -n "$BUILD_RUN_ID" ]; then ARGS+=(--run-id "$BUILD_RUN_ID"); fi
          python3 scripts/verified_build.py reuse "$RUNNER_TEMP/dsh-build/bootstrap" \
            --version "$RELEASE_VERSION" "${ARGS[@]}"

      - name: 安装 Node 24
        if: steps.verified.outputs.reused != 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            runtime/codebuddy/package-lock.json
            tests/js/package-lock.json

      - name: 核对签名密钥与已发布版本一致
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ inputs.signer_ref }}"
          if [ -z "$REF" ]; then
            REF="$(gh release list --limit 50 --json tagName \
              --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-bootstrap$"))][0].tagName')"
          fi
          [ -n "$REF" ] || { echo "[FAIL] 取不到参考版本；可用 signer_ref 指定"; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          URL="https://github.com/yusheng266186-beep/DSH-Native/releases/download/${REF}/DSHNative-bootstrap.apk"
          APKSIGNER_JAR="$BT/lib/apksigner.jar" bash scripts/check_signer.sh "$URL"
          echo "[OK] 与 $REF 的签名一致 —— 用它签出的包可以覆盖安装"

      - name: 升版本号
        if: steps.verified.outputs.reused != 'true'
        run: |
          set -euo pipefail
          bash scripts/bump_version.sh "${{ inputs.version }}"
          git --no-pager diff --stat

      - name: 同步并检查文档（保持已发布清单）
        run: |
          if [ "${{ steps.verified.outputs.reused }}" != true ]; then
            python3 scripts/sync_project_metadata.py --docs-only
          fi
          python3 scripts/sync_project_metadata.py --check --allow-unpublished-source

      - name: 构建
        if: steps.verified.outputs.reused != 'true'
        run: bash scripts/ci_build.sh "$RUNNER_TEMP/dsh-build"

      - name: 使用真实运行包验证模型目录、视觉能力和触屏布局
        if: steps.verified.outputs.reused != 'true'
        run: bash scripts/check_model_consumer.sh

      - name: 复核待发布 APK 的原签名与组成
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          APK="$RUNNER_TEMP/dsh-build/bootstrap/DSHNative-bootstrap.apk"
          APKSIGNER_JAR="$BT/lib/apksigner.jar" bash scripts/check_signer.sh "$APK"
          BADGING="$("$BT/aapt2" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='dev.dsh.native'" | grep -F "versionName='$RELEASE_VERSION'"
          python3 tests/check_apk_components.py "$APK"

      - name: 准备发布说明
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          OUT="$RUNNER_TEMP/notes.md"
          if [ -n "${{ inputs.notes_file }}" ] && [ -f "${{ inputs.notes_file }}" ]; then
            cp "${{ inputs.notes_file }}" "$OUT"
          elif [ -f "release-notes/v${V}.md" ]; then
            cp "release-notes/v${V}.md" "$OUT"
          else
            PREV="$(git tag --list 'v*-bootstrap' --sort=-v:refname | head -1 || true)"
            {
              echo "## v${V}"
              echo
              if [ -n "$PREV" ]; then
                echo "自 ${PREV} 以来的改动："
                echo
                git log --no-merges --pretty='- %s' "${PREV}..HEAD"
              else
                git log --no-merges -n 20 --pretty='- %s'
              fi
            } > "$OUT"
          fi
          python3 - "$OUT" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          from project_docs import release_note_body
          path = pathlib.Path(sys.argv[1])
          path.write_text(release_note_body(path.read_text(encoding='utf-8')), encoding='utf-8')
          PY
          echo "--- 发布说明 ---"
          cat "$OUT"

      - name: 演练模式检查
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "[演练] 构建成功；下面验证 GitHub 推送权限（--dry-run 不会真的推送）"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 允许对已经写入源码的目标版本重复演练。阶段候选通常会先把
          # versionName/versionCode 合入 main，此时 bump_version 是合法的幂等操作，
          # 不应因为 `git commit` 的“无改动”退出码误判演练失败。
          if git diff --cached --quiet; then
            echo "[演练] 版本号已经是目标值；使用当前 HEAD 验证推送权限"
          else
            git commit -q -m "演练：版本号 ${{ inputs.version }} [skip ci]"
          fi
          git push --dry-run origin HEAD:main
          echo "[演练] 通过。真实发布时同样这一步会真正推送。"

      - name: 发布（上传 → 验证两条下载路径 → 最后写清单）
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/release.sh "${{ inputs.version }}" \
               "$RUNNER_TEMP/dsh-build" "$RUNNER_TEMP/notes.md" "${{ inputs.channel }}"

      - name: 提交版本号与清单
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 版本号可能已经是目标版本（例如重发同一个版本以更换签名），
          # 此时没有可提交的内容 —— git commit 会以非零退出，不该因此判定失败。
          if git diff --cached --quiet; then
            echo "[i] 没有需要提交的改动（版本号与清单均已是目标状态）"
          else
            git commit -m "发布 ${{ inputs.version }} ${{ inputs.channel }} 通道：版本号与清单 [skip ci]"
            git push origin HEAD:main
            echo "[OK] 清单已推送，App 现在可以检测到更新"
          fi
