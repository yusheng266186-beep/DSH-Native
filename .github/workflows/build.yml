# PR / 手动运行做完整 Android 构建与真实运行包回归，记录可发版的签名产物。
# main 只有在源码树完全相同且存在成功完整 CI 产物时复用，否则完整构建。
name: 构建 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'payload/**'
      - 'icon/**'
      - '*.md'
      - 'docs/**'
      - 'release-notes/**'
      - 'patch/**/*.md'
      - 'tools/**'
      - 'runtime/android-port.json'
      - 'runtime/core-source.json'
      - 'runtime/compatibility.json'
      - 'runtime/core-package*.json'
      - 'runtime/codebuddy/**'
      - 'runtime/codebuddy-catalog.json'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'payload/**'
      - 'icon/**'
      - '*.md'
      - 'docs/**'
      - 'release-notes/**'
      - 'patch/**/*.md'
      - 'tools/**'
      - 'runtime/android-port.json'
      - 'runtime/core-source.json'
      - 'runtime/compatibility.json'
      - 'runtime/core-package*.json'
      - 'runtime/codebuddy/**'
      - 'runtime/codebuddy-catalog.json'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # ci_stage.sh 用它查"上一个发布版"来取内置负载；未认证 API 会被限流
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 主分支复用相同源码已通过的完整 CI
        id: verified
        if: github.event_name == 'push'
        run: python3 scripts/verified_build.py reuse "$RUNNER_TEMP/dsh-build/bootstrap"

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 24
        if: steps.verified.outputs.reused != 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            runtime/codebuddy/package-lock.json
            tests/js/package-lock.json

      - name: 检查发布元数据（源码可领先已发布版本）
        run: python3 scripts/sync_project_metadata.py --check --allow-unpublished-source

      - name: 构建
        if: steps.verified.outputs.reused != 'true'
        run: bash scripts/ci_build.sh "$RUNNER_TEMP/dsh-build"

      - name: 使用真实运行包验证模型目录、视觉能力和触屏布局
        if: steps.verified.outputs.reused != 'true'
        run: bash scripts/check_model_consumer.sh

      - name: 校验签名与清单
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/dsh-build/bootstrap/DSHNative-bootstrap.apk"
          BT="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          java -jar "$BT/lib/apksigner.jar" verify --min-sdk-version 24 --print-certs "$APK" | head -6
          "$BT/aapt2" dump badging "$APK" | head -3
          APKSIGNER_JAR="$BT/lib/apksigner.jar" bash scripts/check_signer.sh "$APK"

      - name: 记录完整 CI 产物与源码证明
        if: steps.verified.outputs.reused != 'true'
        run: python3 scripts/verified_build.py record "$RUNNER_TEMP/dsh-build/bootstrap/DSHNative-bootstrap.apk"

      - name: 上传 APK
        if: steps.verified.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DSHNative-bootstrap
          path: |
            ${{ runner.temp }}/dsh-build/bootstrap/DSHNative-bootstrap.apk
            ${{ runner.temp }}/dsh-build/bootstrap/verified-build.json
          if-no-files-found: error
          retention-days: 30
