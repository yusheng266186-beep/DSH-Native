# 每次提交构建 APK（验证用，不发布）。
#
# 为什么必须有 CI：构建链依赖 JDK / aapt2 / d8 / apksigner，
# 这些在开发机（Android App 沙箱）里都没有 —— 没有 CI 就只能靠
# 「在设备上手工跑一遍」，也拿不到「每个提交都跑全部断言」的保障。
#
# 构建步骤全部在 scripts/ci_build.sh 里，与发版工作流共用一份 ——
# 各写一份必然漂移，而漂移之后「CI 绿了」就不代表「发出去的包是这样构建的」。
name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'payload/**'
      - 'icon/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # ci_stage.sh 用它查"上一个发布版"来取内置负载；未认证 API 会被限流
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建
        run: bash scripts/ci_build.sh "$RUNNER_TEMP/dsh-build"

      - name: 校验签名与清单
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/dsh-build/bootstrap/DSHNative-bootstrap.apk"
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          java -jar "$BT/lib/apksigner.jar" verify --min-sdk-version 24 --print-certs "$APK" | head -6
          "$BT/aapt2" dump badging "$APK" | head -3

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DSHNative-bootstrap
          path: ${{ runner.temp }}/dsh-build/bootstrap/DSHNative-bootstrap.apk
          if-no-files-found: error
          retention-days: 30

  # 临时生成新 DSH 内核的 payload；发布完成后移除该 job。
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DSH_VERSION: '0.1.7-rc.2'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'

      - name: 安装 zstd
        run: sudo apt-get update -qq && sudo apt-get install -y zstd

      - name: 构建 payload
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dsh-payload-v8"
          base="$work/base"
          pkg="$work/pkg"
          out="$work/payload-v8"
          dsh="$pkg/dsh"
          tools="$pkg/tools_v3"
          mkdir -p "$base" "$dsh" "$tools" "$out"

          gh release download payload-v7 \
            --repo yusheng266186-beep/DSH-Native \
            --pattern '*.tar.zst' \
            --dir "$base"

          tar --use-compress-program=unzstd -xf "$base/dsh.tar.zst" -C "$dsh"
          for archive in tools-base.tar.zst tools-libs.tar.zst tools-python.tar.zst tools-npm.tar.zst; do
            tar --use-compress-program=unzstd -xf "$base/$archive" -C "$tools"
          done
          test -f "$dsh/lib/bin.js"
          test -f "$dsh/node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js"

          npm install --prefix "$dsh" \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            --install-strategy=hoisted \
            "@deepseek-ai/dsh@${DSH_VERSION}"

          npm install --prefix "$dsh" \
            --force --ignore-scripts --no-audit --no-fund --no-save \
            "@mmmbuto/node-pty-android-arm64@1.1.2"
          mkdir -p "$dsh/node_modules/node-pty"
          cat > "$dsh/node_modules/node-pty/index.js" <<'EOF'
          module.exports = require('@mmmbuto/node-pty-android-arm64');
          EOF

          install -D patch/01-require-builtin-shim/node-addon-require-builtin.js \
            "$dsh/node_modules/node-addon-require-builtin/lib/index.js"

          python3 - "$dsh" <<'PY'
          import re
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          def write(path, text):
              path.write_text(text, encoding='utf-8')

          flock = root / 'node_modules/@deepseek-ai/node-addon-system/lib/flock.js'
          if flock.exists():
              text = flock.read_text(encoding='utf-8')
              text = text.replace(
                  "if (platform !== 'linux' && platform !== 'darwin') {",
                  "if (platform !== 'linux' && platform !== 'darwin' && platform !== 'android') {",
                  1,
              )
              if "const pkgPlatform = platform === 'android' ? 'linux' : platform;" not in text:
                  old = (
                      '    const manifest = require.resolve(`@deepseek-ai/node-addon-system-${platform}-${arch}/package.json`)\n'
                      "    binding = require(join(dirname(manifest), 'bin', filename))"
                  )
                  new = (
                      "    const pkgPlatform = platform === 'android' ? 'linux' : platform\n"
                      '    try {\n'
                      '        const manifest = require.resolve(`@deepseek-ai/node-addon-system-${pkgPlatform}-${arch}/package.json`)\n'
                      "        binding = require(join(dirname(manifest), 'bin', filename))\n"
                      '    } catch (error) {\n'
                      '        binding = { tryLock: (_fd, done) => done(0) }\n'
                      '    }'
                  )
                  if old in text:
                      text = text.replace(old, new, 1)
                  else:
                      raise SystemExit('flock source shape not recognized')
              write(flock, text)

          session = root / 'node_modules/@deepseek-ai/dsh-session-persistence-jsonl/lib/index.js'
          if session.exists():
              text = session.read_text(encoding='utf-8')
              if 'internals.fs.link(staged, currentPath)' in text and 'internals.fs.rename(staged, currentPath)' not in text:
                  text = text.replace(
                      'readFile, readdir, realpath, rm, stat, truncate',
                      'readFile, readdir, realpath, rename, rm, stat, truncate',
                      1,
                  )
                  pattern = re.compile(
                      r"try\s*\{\s*await internals\.fs\.link\(staged, currentPath\)\s*\}\s*"
                      r"catch \(error\)\s*\{.*?\}\s*await syncDirectory\(dirname\(currentPath\), internals\)",
                      re.S,
                  )
                  replacement = (
                      'try {\n'
                      '    await internals.fs.lstat(currentPath)\n'
                      '    return false\n'
                      '  } catch (error) {\n'
                      "    if (error?.code !== 'ENOENT') throw error\n"
                      '  }\n'
                      '  await internals.fs.rename(staged, currentPath)\n'
                      '  await syncDirectory(dirname(currentPath), internals)'
                  )
                  text, count = pattern.subn(replacement, text, count=1)
                  if count != 1:
                      raise SystemExit('session publishCurrentExclusive shape not recognized')

              if 'await link(tmp, finalPath)' in text and 'await rename(tmp, finalPath)' not in text:
                  text = text.replace('let linked = false', 'let published = false', 1)
                  text = text.replace('await link(tmp, finalPath)\n      linked = true',
                                      'await rename(tmp, finalPath)\n      published = true', 1)
                  text = text.replace('if (!linked) await rm(tmp, { force: true })',
                                      'if (!published) await rm(tmp, { force: true })', 1)
                  text = text.replace(
                      '    try {\n'
                      '      await rm(tmp, { force: true })\n'
                      '    } catch {}\n'
                      "",
                      1,
                  )
              write(session, text)

          for rel in (
              'node_modules/@img/sharp-linux-arm64',
              'node_modules/@img/sharp-libvips-linux-arm64',
              'node_modules/@img/sharp-wasm32',
          ):
              victim = root / rel
              if victim.exists():
                  shutil.rmtree(victim)
          PY

          tar --exclude='./node_modules/@img/sharp-linux-arm64' \
              --exclude='./node_modules/@img/sharp-libvips-linux-arm64' \
              --exclude='./node_modules/@img/sharp-wasm32' \
              -cf - -C "$dsh" . | zstd -19 -T0 -q -o "$pkg/dsh.tar.zst"

          DSH_PKG_DIR="$pkg" DSH_TOOLS_DIR="$tools" DSH_PAYLOAD_OUT="$out" \
            python3 scripts/make_payload_parts.py

          printf '%s\n' "DSH_VERSION=$DSH_VERSION" > "$out/BUILD-INFO.txt"
          ROOT_VERSION="$(node -p 'require(process.argv[1]).version' "$dsh/package.json")"
          ATTACHMENT_VERSION="$(node -p 'require(process.argv[1]).version' "$dsh/node_modules/@deepseek-ai/dsh-attachment-local/package.json")"
          printf '%s\n' "DSH_ROOT_PACKAGE=$ROOT_VERSION" >> "$out/BUILD-INFO.txt"
          printf '%s\n' "ATTACHMENT_PACKAGE=$ATTACHMENT_VERSION" >> "$out/BUILD-INFO.txt"
          sha256sum "$out"/*.tar.zst "$out/manifest.json" | tee "$out/SHA256SUMS.txt"

      - name: 上传 payload 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: payload-v8
          path: ${{ runner.temp }}/dsh-payload-v8/payload-v8
          if-no-files-found: error
          retention-days: 7
