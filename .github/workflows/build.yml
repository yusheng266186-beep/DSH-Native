# 每次提交构建 APK（验证用，不发布）。
#
# 为什么必须有 CI：构建链依赖 JDK / aapt2 / d8 / apksigner，
# 这些在开发机（Android App 沙箱）里都没有 —— 没有 CI 就只能靠
# 「在设备上手工跑一遍」，也拿不到「每个提交都跑全部断言」的保障。
#
# 构建步骤全部在 scripts/ci_build.sh 里，与发版工作流共用一份 ——
# 各写一份必然漂移，而漂移之后「CI 绿了」就不代表「发出去的包是这样构建的」。
name: 构建 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'payload/**'
      - 'icon/**'
      - '.github/workflows/build.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'payload/**'
      - 'icon/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # ci_stage.sh 用它查"上一个发布版"来取内置负载；未认证 API 会被限流
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建
        run: bash scripts/ci_build.sh "$RUNNER_TEMP/dsh-build"

      - name: 校验签名与清单
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/dsh-build/bootstrap/DSHNative-bootstrap.apk"
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          java -jar "$BT/lib/apksigner.jar" verify --min-sdk-version 24 --print-certs "$APK" | head -6
          "$BT/aapt2" dump badging "$APK" | head -3

      - name: 上传 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DSHNative-bootstrap
          path: ${{ runner.temp }}/dsh-build/bootstrap/DSHNative-bootstrap.apk
          if-no-files-found: error
          retention-days: 30
